<div class="buscador-sidebar flex flex-col h-full">
    <div class="header w-full flex flex-col items-center py-2 mb-4">
        <h2 class="text-2xl font-normal text-primary tracking-tight">Buscador</h2>
        <div class="w-full flex justify-end mt-1">
            <button (click)="clearFilters()" type="button" class="text-accent font-medium text-[10px] hover:underline flex items-center gap-0.5">
                ✕ clear filters
            </button>
        </div>
    </div>

    <form [formGroup]="searchForm" (ngSubmit)="onSubmit()" class="flex flex-col flex-1 gap-7">
        <div class="dates-box border-2 border-accent/20 rounded-xl p-4 flex flex-col gap-4">
            <div class="flex items-center gap-3 relative">
                <fa-icon [icon]="arrivalIcon" class="text-gray-400 text-base"></fa-icon>
                <span class="text-gray-500 font-normal text-sm">Llegada</span>
                <span class="text-accent font-medium text-sm ml-auto">{{ searchForm.get('checkIn')?.value || '1 de Enero, 2025' }}</span>
                <input type="date" formControlName="checkIn" class="absolute inset-0 opacity-0 cursor-pointer">
            </div>
            <div class="flex items-center gap-3 relative">
                <fa-icon [icon]="departureIcon" class="text-gray-400 text-base"></fa-icon>
                <span class="text-gray-500 font-normal text-sm">Salida</span>
                <span class="text-accent font-medium text-sm ml-auto">{{ searchForm.get('checkOut')?.value || '2 de Enero, 2025' }}</span>
                <input type="date" formControlName="checkOut" class="absolute inset-0 opacity-0 cursor-pointer">
            </div>
        </div>

        <div class="guests-input flex flex-row items-center justify-between gap-4">
            <label class="text-gray-700 font-normal text-sm leading-tight max-w-[180px]">
                Buscar habitación por cantidad de personas
            </label>
            <input type="number" formControlName="guests" min="1" 
                   class="w-16 bg-white p-1.5 rounded-md border border-gray-300 text-center font-medium text-sm shadow-sm outline-none focus:border-accent">
        </div>

        <div class="price-range flex flex-col gap-3">
            <label class="text-gray-700 font-normal text-sm">Rango de Precio</label>
            <div class="relative pt-2 px-1">
                <div class="h-1 bg-primary w-full rounded-full"></div>
                <div class="absolute top-1/2 left-0 -translate-y-1/2 w-4 h-4 bg-accent rounded-full border-2 border-white shadow-sm"></div>
                <div class="absolute top-1/2 right-0 -translate-y-1/2 w-4 h-4 bg-accent rounded-full border-2 border-white shadow-sm"></div>
                <input type="range" formControlName="maxPrice" min="0" max="1000" class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer">
            </div>
            <div class="flex justify-between text-xs font-normal text-gray-500 px-1">
                <span>0$</span>
                <span>1000$</span>
            </div>
        </div>

        <div class="locations-list flex flex-col gap-3 flex-1 overflow-hidden">
            <h3 class="text-primary font-bold text-base">Ubicaciones Disponibles</h3>
            <div class="flex flex-col gap-2 overflow-y-auto pr-1">
                @for (city of cities; track city) {
                    <div class="flex items-center gap-3 cursor-pointer group" (click)="searchForm.patchValue({city: city})">
                        <div class="w-4 h-4 rounded-full border-2 border-accent transition-colors shrink-0"
                             [class.bg-white]="searchForm.get('city')?.value !== city"
                             [class.bg-accent]="searchForm.get('city')?.value === city"></div>
                        <span class="text-gray-600 font-normal text-sm group-hover:text-primary transition-colors truncate">{{ city }}</span>
                    </div>
                }
            </div>
        </div>
    </form>
</div>
