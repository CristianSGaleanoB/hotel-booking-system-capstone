<div class="hotel-list flex flex-col gap-8">
    @for (item of data; track (isSearchResult(item) ? item.hotelId : item._id)) {
        <app-hotel-card class="hotel-list__item" [data]="item"></app-hotel-card>
    } @empty {
        <div class="hotel-list__empty p-12 text-center bg-white rounded-3xl border-2 border-dashed border-gray-200">
            <p class="hotel-list__empty-text text-gray-400 text-xl font-medium italic">No se encontraron hoteles para mostrar.</p>
        </div>
    }
</div>
